[project]
name = "attackmate-api-server"
description = "API server for remote control and execution of AttackMate instances."
authors = [
    {name = "Thorina Boenke", email = "aecid@ait.ac.at"}
]
maintainers = [
    {name = "Thorina Boenke", email = "aecid@ait.ac.at"},
    {name = "Wolfgang Hotwagner"},
]
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE.md"]
keywords = ["attackmate", "fastapi", "security", "penetration-testing"]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "colorlog",
    "pydantic",
    "python-multipart",
    "passlib[bcrypt]",
    "argon2-cffi",
    "python-dotenv",
    "pyyaml",
    "attackmate>=1.0.2",
    "pydantic-settings>=2.13.1",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "prek>=0.2.8",
    "pytest>=8.4.1",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov>=6.2.1",
    "types-requests",
]


[project.scripts]
attackmate-api = "attackmate_api_server.main:start"

[project.urls]
Homepage = "https://github.com/ait-testbed/attackmate-api-server"
Repository = "https://github.com/ait-testbed/attackmate-api-server"
Issues = "https://github.com/ait-testbed/attackmate-api-server/issues"
Changelog = "https://github.com/ait-testbed/attackmate-api-server/releases"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "attackmate_api_server.metadata.__version__"}

[tool.flake8]
max-line-length = 110
extend-ignore = ["E203", "W503"]


[[tool.mypy.overrides]]
# Use a wildcard to cover the entire test directory
module = "test.*"
disallow_untyped_decorators = false
disallow_untyped_defs = false
check_untyped_defs = false
